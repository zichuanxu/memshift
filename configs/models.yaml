# Model roles of the experiments, as Hugging Face ids. The revisions are in docs/COMPUTE.md and in
# each run's env.json.
main_writer: Qwen/Qwen3.5-9B
main_reader: Qwen/Qwen3.5-9B
embedding: Qwen/Qwen3-Embedding-0.6B
embedding_swap: BAAI/bge-m3                              # E7 only: the embedding swap (theta_e)
writer_tiers:              # E2 / T1, all same lineage
  same_tier: XiaomiMiMo/MiMo-V2.6-Distill-Qwen-9B     # same size as the main writer
  upgrade: Qwen/Qwen3.8-27B                            # larger model, tensor parallel over two GPUs
  downgrade: reverse of upgrade
  fallback_downgrade: Qwen/Qwen3-4B-Instruct-2507      # downgrade without the 27B model; not used
cross_family:              # other model families as writer or reader
  - openai/gpt-oss-20b                                 # its own response format (harmony)
  - mistralai/Ministral-3-14B-Instruct-2512-BF16       # the reader swap of E7 (theta_r)
# Other model families (stage keys in results/sources.json): writer switches from the main
# writer (m1), E1 with another family as writer and reader (m2), reader swaps (m3) and the world
# rewriter (l).
stage4_families:           # single GPU each, vLLM 0.30.0 main image, pinned revisions
  - meta-llama/Llama-3.1-8B-Instruct                   # M1, M2, M3
  - google/gemma-4-12B-it                              # M1, M2, M3; Apache-2.0, ungated
  - openai/gpt-oss-20b                                 # M1, M2, M3; native MXFP4
  - mistralai/Ministral-3-14B-Instruct-2512-BF16       # M1
  - Qwen/Qwen3-8B                                      # M1 (previous generation of the main lineage)
world_renderer: google/gemma-4-12B-it                  # L: free-text bodies; not the writer/reader family
excluded_v1:               # considered and not used
  - apple/LensVLM-9B                                   # vision context compression; sources are text
